name: API

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - apps/translate/**
      - apps/mobile/src/locales/en.json
      - .github/workflows/api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun --cwd apps/api typecheck
      - run: bun --cwd apps/translate typecheck
      - name: Deploy translation Worker
        working-directory: apps/translate
        run: bunx wrangler deploy
      - name: Apply D1 migrations
        working-directory: apps/api
        run: bunx wrangler d1 migrations apply bewise --remote
      - name: Deploy Worker
        working-directory: apps/api
        run: bunx wrangler deploy
