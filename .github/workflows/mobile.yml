name: Mobile release

# Every push to main that touches the app ships it:
#   - JS/CSS only           -> Capgo live update (OTA), live in minutes
#   - native change needed  -> Capgo Cloud Build, uploaded to App Store + Google Play
# `capgo build needed` compares native dependencies with the bundle on the channel.

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - bun.lock
      - .github/workflows/mobile.yml
  workflow_dispatch:
    inputs:
      release_target:
        description: Auto-detect, force a live update or force a native build
        type: choice
        default: auto
        options: [auto, ota, native]
      submit_for_review:
        description: Submit native builds to App Store / Play review
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  CAPGO_CHANNEL: Production
  APP_ID: ee.forgr.bewise

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      native: ${{ steps.needed.outputs.native }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Compute version
        id: version
        # major.minor come from package.json, patch is the run number:
        # unique and always increasing for both OTA bundles and store builds.
        run: |
          base=$(jq -r .version apps/mobile/package.json | cut -d. -f1,2)
          echo "version=$base.$((GITHUB_RUN_NUMBER + 0))" >> "$GITHUB_OUTPUT"
      - name: Does this change need a native build?
        id: needed
        working-directory: apps/mobile
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
          TARGET: ${{ inputs.release_target || 'auto' }}
        run: |
          if [ "$TARGET" = "native" ]; then echo "native=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$TARGET" = "ota" ]; then echo "native=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          bunx @capgo/cli@latest build needed "$APP_ID" --channel "$CAPGO_CHANNEL" \
            --package-json package.json,../../package.json --node-modules ../../node_modules
          code=$?
          set -e
          case $code in
            0) echo "native=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "native=true" >> "$GITHUB_OUTPUT" ;;
            *) exit $code ;;
          esac

  live-update:
    needs: prepare
    if: needs.prepare.outputs.native == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Stamp version
        working-directory: apps/mobile
        run: bun scripts/set-version.ts ${{ needs.prepare.outputs.version }}
      - run: bun --cwd apps/mobile build
      - name: Upload Capgo bundle
        working-directory: apps/mobile
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          bunx @capgo/cli@latest bundle upload "$APP_ID" --channel "$CAPGO_CHANNEL" --delta \
            --package-json package.json,../../package.json --node-modules ../../node_modules \
            --comment "${{ github.sha }}"

  native-build:
    needs: prepare
    if: needs.prepare.outputs.native == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One cloud build at a time keeps us inside the Capgo plan's concurrency.
      max-parallel: 1
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Stamp version
        working-directory: apps/mobile
        run: bun scripts/set-version.ts ${{ needs.prepare.outputs.version }}
      - name: Build web and sync native project
        working-directory: apps/mobile
        run: bun run build && bunx cap sync ${{ matrix.platform }}
      - name: Point Android at the bundled node_modules
        # Capgo Cloud Build puts --node-modules at the root of the uploaded
        # project and rewrites iOS paths itself; Android needs the same.
        if: matrix.platform == 'android'
        working-directory: apps/mobile/android
        run: |
          grep -rl '\.\./\.\./\.\./node_modules/' --include='*.gradle' . | xargs -r sed -i 's#\(\.\./\)\{3,\}node_modules/#../node_modules/#g'
          grep -rh "node_modules" capacitor.settings.gradle | head -3
      - name: Capgo Cloud Build and store upload
        working-directory: apps/mobile
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
          # iOS
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          CAPGO_IOS_PROVISIONING_MAP: ${{ secrets.CAPGO_IOS_PROVISIONING_MAP }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          # Android
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}
        run: |
          review=""
          if [ "${{ inputs.submit_for_review || 'true' }}" = "true" ]; then review="--submit-to-store-review"; fi
          # Until the Play listing exists (repo variable PLAY_STORE_READY=true), keep the AAB as a download link.
          if [ "${{ matrix.platform }}" = "android" ] && [ "${{ vars.PLAY_STORE_READY }}" != "true" ]; then
            review="--no-playstore-upload --output-upload --output-retention 7d"
          fi
          # "What's new" comes from store/metadata/<locale>.json (Play uses en-US/fr-FR).
          notes=()
          for f in ../../store/metadata/*.json; do
            locale=$(basename "$f" .json)
            [ "${{ matrix.platform }}" = "android" ] && [ "$locale" = "en-GB" ] && locale=en-US
            notes+=(--store-release-notes-locale "$locale=$(jq -r .whatsNew "$f")")
          done
          bunx @capgo/cli@latest build request "$APP_ID" --platform ${{ matrix.platform }} --path . \
            --node-modules ../../node_modules --skip-build-number-bump \
            --store-release-name "${{ needs.prepare.outputs.version }}" \
            --store-release-notes "$(jq -r .whatsNew ../../store/metadata/en-GB.json)" \
            "${notes[@]}" $review

  # After a native release, put the same web build on the channel so the next
  # `build needed` check compares against the new native baseline.
  baseline-bundle:
    needs: [prepare, native-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - working-directory: apps/mobile
        run: bun scripts/set-version.ts ${{ needs.prepare.outputs.version }}
      - run: bun --cwd apps/mobile build
      - name: Upload baseline bundle
        working-directory: apps/mobile
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          bunx @capgo/cli@latest bundle upload "$APP_ID" --channel "$CAPGO_CHANNEL" --delta \
            --package-json package.json,../../package.json --node-modules ../../node_modules \
            --comment "native ${{ needs.prepare.outputs.version }} (${{ github.sha }})"
